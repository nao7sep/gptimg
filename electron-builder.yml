appId: io.github.nao7sep.gptimg
productName: GptImg
copyright: Copyright © Yoshinao Inoguchi
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
extraResources:
  - from: LICENSE
    to: LICENSE
  # The Tahoe "Liquid Glass" icon: a pre-compiled asset catalog, built in company/assets by the
  # liquid-glass-icon tool. CFBundleIconName points macOS 26 at it; older macOS reads
  # CFBundleIconFile, the classic build/icon.icns (mac.icon). Building needs no Xcode.
  - from: build/Assets.car
    to: Assets.car
asarUnpack:
  # The native libraries the SDK's worker loads at run time: sharp for every
  # image, ONNX Runtime for upscaling on export.
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/onnxruntime-node/**
mac:
  category: public.app-category.graphics-design
  icon: build/icon.icns
  # ONNX Runtime ships every platform's binaries; each build keeps only its own.
  files:
    - "!node_modules/onnxruntime-node/bin/napi-v6/{linux,win32}/**"
  # Ad-hoc signed ("-"): no developer certificate, but a valid seal and a
  # stable bundle identity, which the dock name and per-app defaults rely on.
  identity: "-"
  # No notarization, so the hardened runtime would only add library-validation
  # failures for an ad-hoc seal.
  hardenedRuntime: false
  # Electron's own strings in the app's ten languages only.
  electronLanguages: [en, de, es, fr, it, pt_BR, ru, ja, ko, zh_CN]
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  extendInfo:
    CFBundleIconName: painting-hibiscus
    CFBundleLocalizations: [en, de, es, fr, it, pt-BR, ru, ja, ko, zh-Hans]
win:
  icon: build/icon.ico
  files:
    - "!node_modules/onnxruntime-node/bin/napi-v6/{linux,darwin}/**"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**"
  electronLanguages: [en-US, de, es, fr, it, pt-BR, ru, ja, ko, zh-CN]
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
nsis:
  oneClick: false
  multiLanguageInstaller: true
  installerLanguages: [en_US, de_DE, es_ES, fr_FR, it_IT, pt_BR, ru_RU, ja_JP, ko_KR, zh_CN]
