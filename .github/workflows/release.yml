name: Release

# GptImg is the GUI app that carries GptImgSdk (sdk/). Until the
# app exists there is no artifact to build: a tag runs the test gate on every
# supported OS and checks that the tag matches the version. The SDK is never
# packed or published on its own; it is consumed from source and released
# inside the app (sdk-conventions, Packaging).
#
#   - push a tag `v*` -> test on Ubuntu and Windows, then verify the tag.
#   - manual dispatch -> test only, a smoke check.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm test

  tag:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Verify tag matches the app version
        env:
          GPTIMG_RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:release-tag -- "$GPTIMG_RELEASE_TAG"
